<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>proactive-continuity</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11143f"/>
      <stop offset="1" stop-color="#070820"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b46ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b46ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="#2b33c9" stroke-width="4"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- the loop: 300 degrees, open at the top right -->
  <path d="M 396.95 204.70 A 150 150 0 1 1 282.05 108.28" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  <polygon points="320.4,115.1 277.4,77.1 267.0,136.1" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <!-- steps: two done, the next one in progress -->
  <line x1="190" y1="256" x2="322" y2="256" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <circle cx="190" cy="256" r="20" fill="#ffffff"/>
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
  <circle cx="322" cy="256" r="31" fill="#4d5bff" fill-opacity="0.35"/>
  <circle cx="322" cy="256" r="21" fill="#5b68ff" stroke="#ffffff" stroke-width="5"/>
</svg>
